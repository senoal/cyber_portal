<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Black Owl</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> -->

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='login.css') }}">
</head>
<body class="login-page">

<div class="login-ambient" aria-hidden="true">
    <span class="login-orb login-orb--gold"></span>
    <span class="login-orb login-orb--blue"></span>
    <span class="login-grid"></span>
</div>

<div class="login-wrapper">

    <main class="login-card">

        <section class="login-showcase" aria-label="Black Owl security portal">
            <div class="login-brand">

                <div class="login-logo-wrap">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Black Owl">
                </div>

                <div>

                    <h1>BLACK OWL</h1>

                    <p>Enterprise Security Portal</p>

                </div>

            </div>
            <div class="security-scan" aria-hidden="true"><span class="security-scan__ring"></span><span class="security-scan__ring"></span><span class="security-scan__ring"></span><span class="security-scan__beam"></span><span class="security-scan__marker security-scan__marker--one"></span><span class="security-scan__marker security-scan__marker--two"></span><span class="security-scan__marker security-scan__marker--three"></span><span class="security-scan__core">⌾</span></div>
            <p class="login-showcase__caption"><span></span> Secure access gateway</p>
        </section>
        <section class="login-auth">

        <div class="login-header">

            <h2>Welcome Back</h2>

            <p>
                Sign in to access the IT Security Management Platform
            </p>

        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="login-error">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="login-form">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label for="username">Username</label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required>

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <button type="submit"><span>Sign In</span><span class="login-button-arrow" aria-hidden="true">→</span></button>

        </form>

            <div class="login-footer">

                IT Security Department © 2026

            </div>
        </section>

    </main>

</div>

</body>
</html>
