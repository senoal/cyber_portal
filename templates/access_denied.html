<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Belum Diberikan · Black Owl</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-box">
            <h2>Akses Belum Diberikan</h2>
            <p>Akun Anda belum memiliki izin menu. Hubungi administrator untuk mengatur akses yang diperlukan.</p>
            <form method="POST" action="{{ url_for('auth.logout') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <button type="submit">Kembali ke Login</button>
            </form>
        </section>
    </main>
</body>
</html>
